snapshots:
  - name: items_snapshot
    relation: ref('bronze_items')
    config:
      schema: gold
      unique_key: id
      strategy: timestamp
      updated_at: updateDate
      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: ignore # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.
      snapshot_meta_column_names:
        dbt_valid_from: created_at
        dbt_valid_to: valid_to
        dbt_scd_id: srow_id
        dbt_updated_at: updated_at